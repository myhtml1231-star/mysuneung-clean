[[routes]]
pattern = "mysuneung.com/cbt-data/*"
zone_name = "mysuneung.com"

[[routes]]
pattern = "mysuneung.com/mixed-cbt*"
zone_name = "mysuneung.com"

[[routes]]
pattern = "www.mysuneung.com/api/cbt/*"
zone_name = "mysuneung.com"

[[routes]]
pattern = "www.mysuneung.com/cbt-data/*"
zone_name = "mysuneung.com"

[[routes]]
pattern = "www.mysuneung.com/mixed-cbt*"
zone_name = "mysuneung.com"
