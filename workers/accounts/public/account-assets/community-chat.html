<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>수험 챗 · 수능기출</title>
<link rel="stylesheet" href="/account-assets/community.css?v=community-20260929-v1">
<script defer src="/account-assets/community-chat.js?v=community-20260929-v1"></script>
</head>
<body class="chat-shell">
<header class="chat-top">
  <div class="brand"><div class="mark">M</div><div><h1>수험 챗</h1><div id="chatState" class="chat-state">연결 중</div></div></div>
  <a class="btn small" href="/">홈</a>
</header>
<main id="messages" class="messages" aria-live="polite"></main>
<footer class="chat-input">
  <form id="loginForm" class="login-row hidden">
    <input id="nickname" maxlength="24" placeholder="닉네임" autocomplete="username" required>
    <input id="chatPassword" type="password" minlength="4" maxlength="128" placeholder="비밀번호" autocomplete="current-password" required>
    <button id="loginButton" class="btn primary" type="submit">입장</button>
  </form>
  <div id="chatForm" class="hidden">
    <div class="chat-user"><span><strong id="currentUser"></strong> 로그인됨</span><button id="logoutButton" class="btn small" type="button">나가기</button></div>
    <form id="sendForm" class="send-row"><input id="messageInput" maxlength="1000" placeholder="메시지 입력..." autocomplete="off"><button id="sendButton" class="btn primary" type="submit">전송</button></form>
  </div>
  <div id="chatError" class="error" style="max-width:900px;margin:7px auto 0"></div>
</footer>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
