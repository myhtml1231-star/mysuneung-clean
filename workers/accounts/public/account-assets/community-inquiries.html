<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>문의사항 · 수능기출</title>
<link rel="stylesheet" href="/account-assets/community.css?v=community-20260929-v1">
<script defer src="/account-assets/community-inquiries.js?v=community-20260929-v1"></script>
</head>
<body>
<main class="shell">
  <header class="top">
    <div class="brand"><div class="mark">M</div><div><h1>문의사항</h1><p>질문과 답변을 확인할 수 있습니다.</p></div></div>
    <button id="openAsk" class="btn primary" type="button">질문하기</button>
  </header>
  <section id="inquiryList" class="list" aria-live="polite"></section>
</main>

<dialog id="detailDialog">
  <div class="modal">
    <div class="modal-head"><div><h2 id="detailTitle">문의</h2><div id="detailMeta" class="meta"></div></div><button class="close" data-close="detailDialog" type="button" aria-label="닫기">×</button></div>
    <div id="detailLocked" class="hidden">
      <form id="unlockForm" class="form">
        <div class="field"><label for="unlockPassword">비공개 질문 비밀번호</label><input id="unlockPassword" type="password" minlength="4" maxlength="128" autocomplete="current-password" required><div class="hint">비밀번호는 서버에서 해시로 확인하며 브라우저나 공개 데이터에 저장하지 않습니다.</div></div>
        <div id="unlockError" class="error"></div>
        <div class="actions"><button class="btn primary" type="submit">확인</button></div>
      </form>
    </div>
    <div id="detailOpen" class="hidden">
      <div id="detailBody" class="body"></div>
      <div id="detailAnswer"></div>
    </div>
  </div>
</dialog>

<dialog id="askDialog">
  <div class="modal">
    <div class="modal-head"><div><h2>질문하기</h2><div class="meta">문의 내용은 관리자 페이지에서 확인합니다.</div></div><button class="close" data-close="askDialog" type="button" aria-label="닫기">×</button></div>
    <form id="askForm" class="form">
      <div class="field"><label for="title">제목</label><input id="title" maxlength="120" required></div>
      <div class="field"><label for="author">닉네임</label><input id="author" maxlength="40" placeholder="선택사항"></div>
      <div class="field"><label for="privacy">공개 설정</label><select id="privacy"><option value="public">공개</option><option value="private">비공개</option></select></div>
      <div id="passwordField" class="field hidden"><label for="password">비공개 비밀번호</label><input id="password" type="password" minlength="4" maxlength="128" autocomplete="new-password"><div class="hint">4자 이상. 서버에는 원문 비밀번호를 저장하지 않습니다.</div></div>
      <div class="field"><label for="content">질문 내용</label><textarea id="content" maxlength="5000" required></textarea></div>
      <div id="askError" class="error"></div>
      <div class="actions"><button class="btn" data-close="askDialog" type="button">취소</button><button id="askSubmit" class="btn primary" type="submit">등록하기</button></div>
    </form>
  </div>
</dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
