name: Prepare official October 2026 exams
on:
  push:
    branches:
      - codex/october-2026-import
    paths:
      - ops/october-2026/**
      - .github/workflows/october-2026-preparation.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: october-2026-preparation
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install PDF inspection dependency
        run: python -m pip install --disable-pip-version-check pypdf
      - name: Collect and verify all official grades and source assets
        run: python ops/october-2026/collect_official.py
      - name: Record preparation summary
        if: always()
        run: |
          if test -f october-2026-preparation/report.json; then
            cat october-2026-preparation/report.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve source collection for the existing production importer
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: october-2026-official-preparation
          retention-days: 30
          if-no-files-found: error
          path: october-2026-preparation/
