name: transfer-cbt-ui-docx
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/transfer-cbt-ui-docx.yml"
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Download report
        run: curl -fL --retry 3 "https://mysuneung.com/cbt-data/learning/reports/mysuneung-login-myinfo-screenshots-20260927.docx" -o mysuneung-login-myinfo-screenshots-20260927.docx
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cbt-ui-word-report
          path: mysuneung-login-myinfo-screenshots-20260927.docx
          retention-days: 1
