<script>
  const audio = document.getElementById('audio');
  const seek = document.getElementById('seek');
  const timeEl = document.getElementById('time');
  const toggle = document.getElementById('toggle');
  const back10 = document.getElementById('back10');
  const fwd10 = document.getElementById('fwd10');
  const speedBtns = document.querySelectorAll('.speed-btn');

  function fmt(t){
    if(!isFinite(t) || t <= 0) return '00:00';
    const m = Math.floor(t/60).toString().padStart(2,'0');
    const s = Math.floor(t%60).toString().padStart(2,'0');
    return `${m}:${s}`;
  }

  audio.addEventListener('loadedmetadata', () => {
    seek.max = Math.floor(audio.duration);
    timeEl.textContent = `00:00 / ${fmt(audio.duration)}`;
  });

  audio.addEventListener('timeupdate', () => {
    seek.value = audio.currentTime;
    timeEl.textContent = `${fmt(audio.currentTime)} / ${fmt(audio.duration)}`;
  });

  seek.addEventListener('input', () => {
    audio.currentTime = seek.value;
  });

  toggle.addEventListener('click', () => {
    if(audio.paused){
      audio.play();
      toggle.textContent = '⏸ 일시정지';
    } else {
      audio.pause();
      toggle.textContent = '▶ 재생';
    }
  });

  back10.addEventListener('click', ()=> audio.currentTime = Math.max(0, audio.currentTime - 10));
  fwd10.addEventListener('click', ()=> audio.currentTime = Math.min(audio.duration, audio.currentTime + 10));

  speedBtns.forEach(btn => {
    btn.addEventListener('click', ()=>{
      audio.playbackRate = parseFloat(btn.dataset.speed);
      speedBtns.forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
    });
  });
</script>
