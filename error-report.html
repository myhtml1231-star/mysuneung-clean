<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오류 신고</title>

  <style>
    body {
      margin: 0;
      background: #fafafa;
      font-family: "Noto Sans KR", sans-serif;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: 60px auto 0;
      padding: 0 20px;
    }

    h1 {
      font-size: 32px;
      font-weight: 900;
      margin-bottom: 20px;
      color: #333;
    }

    .desc {
      font-size: 15px;
      color: #666;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .form-card {
      background: #ffffff;
      padding: 28px;
      border-radius: 18px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
      border: 1px solid #eee;
      text-align: left;
    }

    label {
      font-weight: 700;
      font-size: 15px;
      color: #333;
    }

    input, textarea {
      width: 100%;
      box-sizing: border-box;
      margin-top: 8px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
    }

    textarea {
      height: 140px;
      resize: none;
    }

    input:focus, textarea:focus {
      border-color: #F4B733;
      box-shadow: 0 0 0 3px rgba(244,183,51,0.2);
    }

    .btn-submit {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background: #F4B733;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      color: white;
      transition: 0.2s;
    }

    .btn-submit:hover {
      background: #e0a325;
      transform: translateY(-2px);
    }

    .success-box {
      margin-top: 24px;
      background: #fff9e6;
      padding: 16px;
      border-radius: 10px;
      border-left: 4px solid #F4B733;
      color: #8a6d00;
      font-weight: 600;
      display: none;
    }

    .back-btn {
      display: inline-block;
      margin: 40px auto 40px;
      padding: 12px 26px;
      font-size: 16px;
      background: #f0f0f0;
      border-radius: 12px;
      color: #444;
      text-decoration: none;
      border: 1px solid #ddd;
      transition: 0.2s;
    }

    .back-btn:hover {
      background: #e4e4e4;
      transform: translateY(-2px);
    }
  </style>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-B7Q0KVYYH5"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);} 
  gtag('js', new Date());

  gtag('config', 'G-B7Q0KVYYH5');
</script>
</head>

<body>

  <div class="container">
    <h1>🚨 오류 신고</h1>
    <p class="desc">
      자료 오류, 오타, 잘못된 링크 등을 발견하셨다면 알려주세요.<br>
      정확한 서비스 제공을 위해 큰 도움이 됩니다!
    </p>

    <div class="form-card">
      <label>닉네임 (보상 지급용)</label>
      <input id="nickname" type="text" placeholder="예: 수능마스터">

      <br><br>

      <label>오류 내용</label>
      <textarea id="content" placeholder="발견한 오류를 자세히 적어주세요."></textarea>

      <button class="btn-submit" id="submit-btn">오류 신고 제출하기</button>

      <div class="success-box" id="success-box"></div>
    </div>

    <a href="index.html" class="back-btn">←이전화면으로 돌아가기</a>
  </div>

  <script>
    const submitBtn = document.getElementById("submit-btn");
    const nicknameInput = document.getElementById("nickname");
    const contentInput = document.getElementById("content");
    const successBox = document.getElementById("success-box");

    function showResult(message, ok) {
      successBox.textContent = message;
      successBox.style.display = "block";
      successBox.style.background = ok ? "#fff9e6" : "#fff1f1";
      successBox.style.borderLeftColor = ok ? "#F4B733" : "#dc2626";
      successBox.style.color = ok ? "#8a6d00" : "#991b1b";
    }

    submitBtn.addEventListener("click", async () => {
      const nickname = nicknameInput.value.trim();
      const content = contentInput.value.trim();

      if (!nickname || !content) {
        showResult("닉네임과 오류 내용을 모두 입력해주세요.", false);
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "접수 중...";

      try {
        const res = await fetch("/api/report", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            nickname,
            content,
            sourcePage: document.referrer || location.href
          })
        });

        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || "접수 중 문제가 발생했습니다.");

        showResult("✔ 오류 신고가 정상적으로 접수되었습니다!", true);
        contentInput.value = "";
      } catch (err) {
        console.error(err);
        showResult(err.message || "오류 신고 중 문제가 발생했습니다. 잠시 후 다시 시도해주세요.", false);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "오류 신고 제출하기";
      }
    });
  </script>

<script type="module" src="visit-counter.js"></script>

</body>
</html>
