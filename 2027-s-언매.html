        text-decoration: none;
        color: #2b2d31;
        font-size: 18px;
        font-weight: 500;
    }

    .download-box:hover {
        transform: translateY(-3px);

    }

    .download-box span {

        border: 1px solid #ddd;
        transition: 0.2s;
        text-align: center;

    .back-btn:hover {
        background: #e4e4e4;
