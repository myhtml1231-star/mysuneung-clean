<script>
const audio=document.getElementById('audio'),seek=document.getElementById('seek'),timeEl=document.getElementById('time'),toggle=document.getElementById('toggle');
function fmt(t){if(!isFinite(t)||t<=0)return'00:00';return Math.floor(t/60).toString().padStart(2,'0')+':'+Math.floor(t%60).toString().padStart(2,'0')}
audio.addEventListener('loadedmetadata',()=>{seek.max=Math.floor(audio.duration);timeEl.textContent='00:00 / '+fmt(audio.duration)});
audio.addEventListener('timeupdate',()=>{seek.value=audio.currentTime;timeEl.textContent=fmt(audio.currentTime)+' / '+fmt(audio.duration)});
seek.addEventListener('input',()=>audio.currentTime=seek.value);
toggle.addEventListener('click',()=>{if(audio.paused){audio.play();toggle.textContent='⏸ 일시정지'}else{audio.pause();toggle.textContent='▶ 재생'}});
document.getElementById('back10').addEventListener('click',()=>audio.currentTime=Math.max(0,audio.currentTime-10));
document.getElementById('fwd10').addEventListener('click',()=>audio.currentTime=Math.min(audio.duration,audio.currentTime+10));
document.querySelectorAll('.speed-btn').forEach(btn=>btn.addEventListener('click',()=>{audio.playbackRate=parseFloat(btn.dataset.speed);document.querySelectorAll('.speed-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}));
</script>
