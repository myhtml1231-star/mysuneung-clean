<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>국어 CBT 베타</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--line:#e4e8ef;--text:#1d2430;--muted:#6b7280;--brand:#f4b733;--brand2:#e8a71f;--blue:#526fe8;--good:#16854b;--bad:#d14343}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Apple SD Gothic Neo",sans-serif}
button,input{font:inherit}button{cursor:pointer}
.topbar{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:16px;position:sticky;top:0;z-index:50}
.brand{font-weight:900;font-size:19px;white-space:nowrap}.sub{font-size:12px;color:var(--muted);margin-top:2px}.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.timer{font-variant-numeric:tabular-nums;font-weight:800;background:#f7f8fb;padding:8px 11px;border-radius:9px;border:1px solid var(--line)}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px}
.progress-line{height:4px;background:#e8ebf1;position:sticky;top:64px;z-index:45}.progress-line>i{display:block;height:100%;width:0;background:var(--brand);transition:.2s}
.shell{max-width:1420px;margin:auto;padding:18px;display:grid;grid-template-columns:minmax(420px,1.06fr) minmax(430px,.94fr) 86px;gap:16px;min-height:calc(100vh - 68px)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:0 3px 14px rgba(24,34,50,.045)}
.passage{padding:26px 29px;position:sticky;top:84px;align-self:start;max-height:calc(100vh - 102px);overflow:auto}
.passage-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eef0f4;padding-bottom:12px;margin-bottom:20px}
.passage-head b{font-size:15px}.passage-tools{display:flex;gap:5px}.passage-tools button{border:1px solid var(--line);background:#fff;border-radius:7px;width:30px;height:30px}
.section-label{font-weight:900;font-size:17px;margin:22px 0 10px}.section-label:first-child{margin-top:0}
.passage-text{font-family:"Noto Serif KR","Batang","AppleMyungjo",serif;font-size:17px;line-height:1.95;letter-spacing:-.015em;word-break:keep-all;text-align:justify}
.passage-text p{margin:0 0 16px}
.question-panel{padding:0;overflow:hidden;align-self:start}
.qtop{padding:17px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.qcounter{font-weight:900;font-size:17px}.source-mini{font-size:12px;color:var(--muted)}.mark{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px}.mark.on{background:#fff4cc;border-color:#efc55b}
.qbody{padding:25px 25px 18px}.stem{display:flex;gap:10px;font-size:17px;line-height:1.7;font-weight:650;word-break:keep-all}.qnum{font-size:21px;font-weight:900;min-width:28px}
.viewbox{margin:18px 0;background:#f8fafc;border:1px solid #dbe0e8;border-radius:11px;padding:16px 18px;line-height:1.78;font-family:"Noto Serif KR","Batang",serif;word-break:keep-all}.viewtitle{text-align:center;font-weight:900;margin-bottom:8px}
.choices{display:grid;gap:9px;margin-top:18px}.choice{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;border:1px solid #dfe3ea;background:#fff;border-radius:12px;padding:13px 14px;line-height:1.58;word-break:keep-all;text-align:left;transition:.12s}.choice:hover{border-color:#aeb8ca;background:#fbfcfe}.choice .circle{width:29px;height:29px;border:1.5px solid #bcc3cf;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#555;background:#fff}.choice.selected{border-color:var(--blue);background:#f1f5ff;box-shadow:0 0 0 1px var(--blue) inset}.choice.selected .circle{background:var(--blue);border-color:var(--blue);color:#fff}
.choice.correct{border-color:#5ab486;background:#eefaf3}.choice.correct .circle{background:var(--good);border-color:var(--good);color:#fff}.choice.wrong{border-color:#e29191;background:#fff2f2}.choice.wrong .circle{background:var(--bad);border-color:var(--bad);color:#fff}
.navrow{border-top:1px solid var(--line);padding:14px 18px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}.navrow button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 16px;font-weight:800}.navrow .next{justify-self:end;background:#222;color:#fff;border-color:#222}.navrow .submit{background:var(--brand);border-color:var(--brand);color:#fff}.navrow button:disabled{opacity:.35;cursor:default}
.palette{position:sticky;top:84px;align-self:start;padding:9px;display:grid;gap:7px}.palbtn{width:48px;height:43px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:800;position:relative}.palbtn.current{border:2px solid #222}.palbtn.answered{background:#eef4ff;border-color:#9eb0ed}.palbtn.marked:after{content:"";position:absolute;right:4px;top:4px;width:7px;height:7px;border-radius:50%;background:#e5aa21}.palbtn.bad{background:#fff0f0;border-color:#e7a4a4}.palbtn.good{background:#edf9f2;border-color:#86c9a3}
.mobile-passage{display:none;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 11px;font-weight:800}
.result-note{display:none;margin:16px 25px 0;padding:13px 15px;border-radius:10px;background:#f7f8fb;font-size:14px;line-height:1.55}.result-note.show{display:block}
.overlay{display:none;position:fixed;inset:0;background:rgba(15,20,30,.48);z-index:100;align-items:center;justify-content:center;padding:20px}.overlay.open{display:flex}.modal{width:min(470px,100%);background:#fff;border-radius:18px;padding:26px;box-shadow:0 18px 60px rgba(0,0,0,.25)}.score{font-size:48px;font-weight:950;margin:10px 0}.modal p{color:var(--muted);line-height:1.6}.modal-actions{display:flex;gap:8px;margin-top:18px}.modal-actions button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:800}.modal-actions .primary{background:#222;color:#fff;border-color:#222}
@media(max-width:980px){.shell{grid-template-columns:1fr 72px}.passage{display:none;position:fixed;z-index:70;left:10px;right:10px;top:72px;bottom:10px;max-height:none}.passage.mobile-open{display:block}.mobile-passage{display:inline-block}.question-panel{grid-column:1}.palette{grid-column:2;grid-row:1}.topbar{gap:8px}.sub{display:none}}
@media(max-width:640px){.topbar{height:auto;min-height:58px;padding:9px 10px;flex-wrap:wrap}.brand{font-size:17px}.top-actions{gap:5px}.timer{padding:7px 8px}.progress-line{top:58px}.shell{display:block;padding:8px}.palette{position:static;display:flex;overflow:auto;margin-bottom:8px;padding:8px}.palbtn{min-width:42px;width:42px;height:38px}.qbody{padding:20px 16px 15px}.qtop{padding:13px 15px}.stem{font-size:16px}.choice{padding:12px 11px}.navrow{padding:11px}.passage{top:65px}.mobile-passage{font-size:13px}.source-mini{display:none}}
</style>
</head>
<body>
<div class="topbar">
  <div><div class="brand">국어 CBT <span style="color:#e3a31d">BETA</span></div><div class="sub" id="sourceLabel"></div></div>
  <button class="mobile-passage" id="passageToggle">지문 보기</button>
  <div class="top-actions">
    <button class="iconbtn" id="resetBtn" title="답안 초기화">초기화</button>
    <div class="timer" id="timer">00:00</div>
  </div>
</div>
<div class="progress-line"><i id="progressBar"></i></div>
<main class="shell">
  <section class="panel passage" id="passagePanel">
    <div class="passage-head"><b>지문</b><div class="passage-tools"><button id="fontDown">A−</button><button id="fontUp">A+</button></div></div>
    <div id="passageContent"></div>
  </section>
  <section class="panel question-panel">
    <div class="qtop"><div class="qcounter" id="qCounter"></div><div class="source-mini" id="origNo"></div><button class="mark" id="markBtn">☆ 다시 보기</button></div>
    <div class="result-note" id="resultNote"></div>
    <div class="qbody" id="questionBody"></div>
    <div class="navrow"><button id="prevBtn">← 이전</button><button class="submit" id="submitBtn">채점하기</button><button class="next" id="nextBtn">다음 →</button></div>
  </section>
  <aside class="panel palette" id="palette"></aside>
</main>

<script id="examData" type="application/json">{"id": "2027-03-common-q04-09", "title": "2027학년도 3월 국어 · 사회 주제 통합", "sourceLabel": "2027학년도 3월 전국연합 · 원문 4~9번", "passage": {"sections": [{"label": "(가)", "text": "국가는 형사 절차를 통해 개인에게 강제력을 행사한다. 형사 절차에서 이루어지는 체포나 구속과 같은 강제 처분은 신체의 자유를 제한한다. 수사 기관이 강제 처분의 행사를 자체적으로 판단하고 결정한다면 권한이 ⓐ남용되어 인권 침해로 이어질 위험이 크다. 따라서 강제 처분을 행사하기 위해서는 사전에 법관이 발부한 영장을 받는 것을 원칙으로 하는데, 이 원칙을 영장주의라고 한다. 영장주의에 따라 수사 기관은 강제 처분을 행사하기 전에 법원에 영장을 청구해야 한다. 영장은 국가의 권한 행사가 합법적인 것이라는 판단을 명시적으로 드러내는 허가 문서이면서, 기본권 제한의 정당성을 사전에 심사했다는 것을 드러내는 표지이기도 하다. 이 점에서 영장주의는 ⓑ개인을 보호하는 예방적 통제 장치로 기능한다. 영장주의가 모든 사안에 항상 적용되는 것은 아니다. 체포는 수사를 위해 개인의 신체를 일시적으로 확보하는 조치이므로 원칙적으로 영장이 필요하다. 하지만 영장 발부를 기다리기 어려운 상황에서 이루어지는 긴급 체포나 현행범 체포의 경우에는 체포 영장이 없어도 강제력 행사가 가능하다. ㉮이때 강제 처분에 대한 법원의 판단은 사전 승인이 아닌 사후 검증의 성격을 띠게 된다. 구속은 체포와 달리 신체의 자유를 장기간에 걸쳐 전면적으로 제한하는 강력한 조치이므로 예외 없이 영장주의가 적용된다. 과거에는 법관이 수사 기록만을 검토하여 구속 영장의 발부를 결정하였으나, ⓒ이것만으로는 부족하다는 비판을 받았다. 따라서 수사 기록의 검토와 함께 법관이 피의자를 심문하여 구속 여부를 판단하는 ㉠영장 실질 심사가 도입되었다. 수사 기관이 구속 영장을 청구하면 법원은 정해진 기일 내에 반드시 피의자 심문을 실시해야 한다. 이는 범죄 혐의의 상당성, 도주나 증거 인멸의 위험과 같은 구속 요건을 검증하는 절차를 강화함으로써 구속 영장이 발부되는 문턱을 과거보다 실질적으로 높인 장치라 할 수 있다."}, {"label": "(나)", "text": "적부 심사는 체포되거나 구속된 개인이 그 처분이 법적으로 정당한지에 대한 심사를 법원에 청구할 수 있는 제도이다. 이는 형사 절차 중에 행하여진 강제 처분이 적법한 절차를 따랐는지와 실질적으로 필요했는지를 점검하기 위한 것이다. 체포 또는 구속이 이루어진 시점은 이미 개인에 대한 국가의 강제력이 행사된 상태이지만, 적부 심사는 그 효력이 유지될 수 있는지를 판단하도록 하여 국가의 권한을 제도적으로 견제한다. 적부 심사의 청구권자는 피의자 본인뿐 아니라 그 변호인, 법정 대리인, 친족, 동거인 또는 고용주까지 폭넓게 인정된다. 이는 피의자가 ⓓ강제 처분으로 인해 방어권을 행사하기가 실제로는 어려운 상황임을 고려하여 주변의 다양한 주체가 이미 행사된 강제 처분의 적법성 다툼을 ⓔ제기할 수 있도록 하기 위한 것이다. 청구서가 접수되면 법원은 48시간 내에 체포 혹은 구속된 피의자를 심문해야 한다. 심문 과정에는 수사 기관과 변호인이 참여할 수 있고 청구권자의 참여도 가능하다. 법관은 체포 또는 구속이 적법한 절차에 따라 진행되었는지, 범죄 혐의의 상당성과 도주 또는 증거 인멸의 위험과 같은 강제 처분의 법률상 요건이 충족되었는지를 확인한다. 그리고 증거의 적법성과 피의자의 진술 등을 심사하여 강제 처분이 유지될 필요가 있는지를 판단한다. ㉡구속 적부 심사에서는 영장 발부가 적법했더라도 이후 상황에서 피의자의 도주 또는 증거 인멸의 위험이 사라졌다면, 법원은 피의자의 석방을 결정하고 피의자는 불구속 상태에서 수사받게 된다. 이는 영장 발부라는 일회적 판단이 강제 처분의 정당성을 지속적으로 담보할 수 없다는 점을 제도적으로 반영한 결과이다. 즉 강제 처분은 합법적인 권력 행사이지만, 적부 심사는 강제 처분이 이루어진 이후 그 효력의 유지 여부를 판단하는 절차라는 점에서 강제 처분에 대한 사법적 통제가 다양한 시점에서 이루어진다는 것을 보여 준다."}]}, "questions": [{"no": 1, "original_no": 4, "stem": "(가)와 (나)에 대한 설명으로 가장 적절한 것은?", "view_text": null, "choices": [{"index": 1, "text": "(가)는 강제 처분의 적용 범위를, (나)는 강제 처분의 효과와 한계를 설명하고 있다."}, {"index": 2, "text": "(가)는 강제 처분의 이론적 배경을, (나)는 강제 처분이 행사된 실제 사례를 설명하고 있다."}, {"index": 3, "text": "(가)는 강제 처분이 정당화되는 과정을, (나)는 강제 처분의 행사 주체가 달라지는 과정을 설명하고 있다."}, {"index": 4, "text": "(가)는 강제 처분이 기본권 보호에 필요한 이유를, (나)는 강제 처분이 기본권에 미치는 영향을 설명하고 있다."}, {"index": 5, "text": "(가)는 강제 처분을 행사하기 위한 조건을, (나)는 행사된 강제 처분의 유지 여부를 판단하는 절차를 설명하고 있다."}]}, {"no": 2, "original_no": 5, "stem": "(가)와 (나)를 읽고 알 수 있는 내용으로 가장 적절한 것은?", "view_text": null, "choices": [{"index": 1, "text": "강제 처분에 대한 법원의 판단은 기본권을 제한하는 국가의 권력 행사에 정당성을 부여할 수 있다."}, {"index": 2, "text": "강제 처분은 기본권을 제한하므로 피의자는 수사 기관에 강제 처분에 대한 판단을 청구할 수 있다."}, {"index": 3, "text": "체포와 구속은 신체의 자유를 제한하는 정도가 다르므로 수사 기관의 강제력을 통제하는 기관이 달라진다."}, {"index": 4, "text": "현행범으로 체포된 경우에는 범죄 혐의가 명확하기 때문에 강제 처분에 대한 적부 심사를 시행하지 않는다."}, {"index": 5, "text": "적부 심사에서 강제 처분 행사에 대한 법원의 결정이 잘못되었다고 인정되면 피의자에 대한 수사가 종결된다."}]}, {"no": 3, "original_no": 6, "stem": "㉠과 ㉡을 이해한 내용으로 가장 적절한 것은?", "view_text": null, "choices": [{"index": 1, "text": "㉠에서의 법관의 결정이 적법했다고 ㉡에서 인정되더라도 피의자의 기본권을 제한하는 양상은 달라질 수 있다."}, {"index": 2, "text": "㉡에서의 법관의 판단은 ㉠으로 인해 일어날 수 있는 개인의 신체적 자유에 대한 제한을 예방하기 위한 절차이다."}, {"index": 3, "text": "㉠은 상황에 따라 생략될 수도 있지만, ㉡은 상황과 무관하게 필수적으로 진행된다."}, {"index": 4, "text": "㉠은 청구권자가 수사 기관으로 한정되지만, ㉡은 피의자 본인 이외에도 청구권자가 다양하다."}, {"index": 5, "text": "㉠은 강제 처분 이전이므로 법관이 피의자를 심문하지 않지만, ㉡은 강제 처분 이후이므로 법관이 피의자를 심문한다."}]}, {"no": 4, "original_no": 7, "stem": "(가)와 (나)를 바탕으로 할 때, ㉮의 의미로 가장 적절한 것은?", "view_text": null, "choices": [{"index": 1, "text": "강제 처분의 적법성은 행사 이전에 검증받아야 한다는 것이다."}, {"index": 2, "text": "판단 시점에 따라 강제 처분의 행사 여부가 달라질 수 있다는 것이다."}, {"index": 3, "text": "강제 처분에 대한 법원의 판단이 적부 심사에서 처음으로 이루어질 수 있다는 것이다."}, {"index": 4, "text": "개인에게 피해를 주는 국가 권력을 행사할 때는 다수의 검증 절차를 시행해야 한다는 것이다."}, {"index": 5, "text": "형사 절차에서 강제 처분이 이루어지기 위해서는 수사 기관이 아닌 다른 주체의 객관적 판단이 필요하다는 것이다."}]}, {"no": 5, "original_no": 8, "stem": "(가)와 (나)를 바탕으로 <보기>를 이해한 내용으로 적절하지 않은 것은? [3점]", "view_text": "갑은 문화재 연쇄 훼손 사건의 피의자로 긴급 체포되었다. 그는 혐의를 적극 부인하였지만, 수사 기관은 여러 증거를 고려할 때 범죄 혐의가 충분하다고 판단하여 갑에 대한 구속 영장을 청구하였고 곧 구속 영장이 발부되었다. 갑의 변호인은 갑을 접견한 이후 구속 적부 심사를 청구하였다. 적부 심사에서 갑의 변호인은 구속 요건이 충족되지 않는다는 것을 근거로 갑의 석방을 주장하였다. 법원은 이를 받아들여 갑의 석방을 결정하였고, 갑은 불구속 상태에서 수사받게 되었다.", "choices": [{"index": 1, "text": "체포 이후 갑에게는 이미 일어난 신체적 자유의 제한에 대한 판단을 청구할 권리가 주어지겠군."}, {"index": 2, "text": "갑에게 발부된 영장은 법원의 판단 결과를 명시적으로 드러내어 기본권 제한에 정당성을 부여하겠군."}, {"index": 3, "text": "법원이 구속 영장을 발부한 것은 갑에게 이미 행해진 강제 처분의 정당성을 심사할 필요가 있다고 판단하였기 때문이겠군."}, {"index": 4, "text": "갑의 변호인이 구속 적부 심사를 청구한 것은 강제 처분의 효력을 정지시켜 불구속 상태에서 수사를 받게 하려는 것이겠군."}, {"index": 5, "text": "법원이 갑을 석방하기로 결정한 것은 갑이 도주하거나 증거를 인멸할 위험이 사라졌다고 판단했기 때문이겠군."}]}, {"no": 6, "original_no": 9, "stem": "ⓐ～ⓔ의 문맥상 의미에 대한 이해로 적절하지 않은 것은?", "view_text": null, "choices": [{"index": 1, "text": "ⓐ: 통제 없이 사용되어"}, {"index": 2, "text": "ⓑ: 기본권의 제한을 보장하는"}, {"index": 3, "text": "ⓒ: 기본권 제한의 근거로는 한계가 있다는"}, {"index": 4, "text": "ⓓ: 신체의 자유를 제한당해"}, {"index": 5, "text": "ⓔ: 법원에 청구할 수 있도록"}]}], "answers": {"4": 5, "5": 1, "6": 1, "7": 3, "8": 3, "9": 2}}</script>
<script>
const exam=JSON.parse(document.getElementById('examData').textContent);
const STORE='mysuneung-cbt-beta-'+exam.id;
const state=Object.assign({current:0,answers:{},marked:{},font:17,elapsed:0,submitted:false},JSON.parse(localStorage.getItem(STORE)||'{}'));
let tick=null;
const $=s=>document.querySelector(s);
const save=()=>localStorage.setItem(STORE,JSON.stringify(state));

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function splitParagraphs(text){
  const sentences=text.match(/[^.!?]+[.!?]+(?:[”’」』])?|[^.!?]+$/g)||[text];
  const out=[]; let buf=[];
  sentences.forEach(x=>{buf.push(x.trim()); if(buf.length>=3){out.push(buf.join(' '));buf=[]}});
  if(buf.length)out.push(buf.join(' ')); return out;
}
function renderPassage(){
  const wrap=$('#passageContent');wrap.innerHTML='';
  exam.passage.sections.forEach(sec=>{
    if(sec.label){const h=document.createElement('div');h.className='section-label';h.textContent=sec.label;wrap.appendChild(h)}
    const box=document.createElement('div');box.className='passage-text';box.style.fontSize=state.font+'px';
    splitParagraphs(sec.text).forEach(p=>{const el=document.createElement('p');el.textContent=p;box.appendChild(el)});
    wrap.appendChild(box);
  });
}
function choiceButton(q,c){
  const b=document.createElement('button');b.className='choice';b.type='button';
  const selected=Number(state.answers[q.no])===c.index;if(selected)b.classList.add('selected');
  if(state.submitted){
    const correct=exam.answers[q.original_no];
    if(c.index===correct)b.classList.add('correct');
    if(selected&&c.index!==correct)b.classList.add('wrong');
  }
  b.innerHTML='<span class="circle">'+c.index+'</span><span>'+esc(c.text)+'</span>';
  b.onclick=()=>{if(state.submitted)return;state.answers[q.no]=c.index;save();renderQuestion();renderPalette()};
  return b;
}
function renderQuestion(){
  const q=exam.questions[state.current];$('#qCounter').textContent=(state.current+1)+' / '+exam.questions.length;$('#origNo').textContent='원문 '+q.original_no+'번';
  $('#markBtn').classList.toggle('on',!!state.marked[q.no]);$('#markBtn').textContent=state.marked[q.no]?'★ 다시 보기':'☆ 다시 보기';
  const body=$('#questionBody');body.innerHTML='';
  const stem=document.createElement('div');stem.className='stem';stem.innerHTML='<span class="qnum">'+q.no+'.</span><span>'+esc(q.stem)+'</span>';body.appendChild(stem);
  if(q.view_text){const v=document.createElement('div');v.className='viewbox';v.innerHTML='<div class="viewtitle">&lt;보기&gt;</div><div>'+esc(q.view_text)+'</div>';body.appendChild(v)}
  const cs=document.createElement('div');cs.className='choices';q.choices.forEach(c=>cs.appendChild(choiceButton(q,c)));body.appendChild(cs);
  $('#prevBtn').disabled=state.current===0;$('#nextBtn').disabled=state.current===exam.questions.length-1;
  $('#progressBar').style.width=((Object.keys(state.answers).length/exam.questions.length)*100)+'%';
  const rn=$('#resultNote');
  if(state.submitted){const chosen=Number(state.answers[q.no]);const correct=exam.answers[q.original_no];rn.classList.add('show');rn.innerHTML=chosen===correct?'정답입니다.':'선택한 답: <b>'+(chosen||'미응답')+'</b> · 정답: <b>'+correct+'</b>'}else{rn.classList.remove('show');rn.textContent=''}
}
function renderPalette(){
  const p=$('#palette');p.innerHTML='';
  exam.questions.forEach((q,i)=>{const b=document.createElement('button');b.className='palbtn';b.textContent=i+1;if(i===state.current)b.classList.add('current');if(state.answers[q.no])b.classList.add('answered');if(state.marked[q.no])b.classList.add('marked');if(state.submitted){const ok=Number(state.answers[q.no])===exam.answers[q.original_no];b.classList.add(ok?'good':'bad')}b.onclick=()=>{state.current=i;save();renderQuestion();renderPalette()};p.appendChild(b)})
}
function go(d){const n=state.current+d;if(n>=0&&n<exam.questions.length){state.current=n;save();renderQuestion();renderPalette();window.scrollTo({top:0,behavior:'smooth'})}}
function submitExam(){
  const unanswered=exam.questions.filter(q=>!state.answers[q.no]).length;
  if(unanswered&&!confirm('미응답 '+unanswered+'문항이 있습니다. 그대로 채점할까요?'))return;
  state.submitted=true;save();
  let correct=0;exam.questions.forEach(q=>{if(Number(state.answers[q.no])===exam.answers[q.original_no])correct++});
  $('#scoreText').textContent=correct+' / '+exam.questions.length;$('#scoreDesc').textContent='정답 '+correct+'문항 · 오답/미응답 '+(exam.questions.length-correct)+'문항';$('#resultOverlay').classList.add('open');renderQuestion();renderPalette();
}
function resetAll(){if(!confirm('선택한 답안을 모두 지울까요?'))return;state.answers={};state.marked={};state.current=0;state.elapsed=0;state.submitted=false;save();renderQuestion();renderPalette();updateTimer()}
function updateTimer(){const m=Math.floor(state.elapsed/60),s=state.elapsed%60;$('#timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}

$('#sourceLabel').textContent=exam.sourceLabel;
$('#prevBtn').onclick=()=>go(-1);$('#nextBtn').onclick=()=>go(1);$('#submitBtn').onclick=submitExam;$('#resetBtn').onclick=resetAll;
$('#markBtn').onclick=()=>{const q=exam.questions[state.current];state.marked[q.no]=!state.marked[q.no];save();renderQuestion();renderPalette()};
$('#fontDown').onclick=()=>{state.font=Math.max(14,state.font-1);save();renderPassage()};$('#fontUp').onclick=()=>{state.font=Math.min(22,state.font+1);save();renderPassage()};
$('#passageToggle').onclick=()=>{$('#passagePanel').classList.toggle('mobile-open');$('#passageToggle').textContent=$('#passagePanel').classList.contains('mobile-open')?'지문 닫기':'지문 보기'};
$('#reviewBtn').onclick=()=>{$('#resultOverlay').classList.remove('open')};$('#retryBtn').onclick=()=>{state.answers={};state.marked={};state.current=0;state.elapsed=0;state.submitted=false;save();$('#resultOverlay').classList.remove('open');renderQuestion();renderPalette();updateTimer()};
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;if(['1','2','3','4','5'].includes(e.key)&&!state.submitted){const q=exam.questions[state.current];state.answers[q.no]=Number(e.key);save();renderQuestion();renderPalette()}else if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1)});
renderPassage();renderQuestion();renderPalette();updateTimer();
tick=setInterval(()=>{if(!state.submitted){state.elapsed++;if(state.elapsed%5===0)save();updateTimer()}},1000);
</script>
</body></html>
